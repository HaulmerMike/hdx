<title>Haulmerland Drinking Exchange</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a trading-floor board. Sticky header with the HDX index, a news strip, the board (tiers) with a side rail
   of index chart / movers / sectors, and a ticker tape pinned to the bottom. TV mode rotates panes full-screen. */
:root{
  --bg:#0B0B0D; --bg-alt:#101117; --card:#16171C; --card-alt:#1C1E25; --border:#2A2C34;
  --text:#FFFFFF; --text-2:#A3A3A3; --text-3:#8A93A3;
  --navy:#1A2456; --navy-2:#2E3A78; --slate:#475569;
  /* En HDX verde significa más barato (bueno para quien compra) y rojo más caro. */
  --good:#2EE59D; --bad:#FF4D6D;
  --up:#FF4D6D; --up-dim:rgba(255,77,109,.14); --down:#2EE59D; --down-dim:rgba(46,229,157,.14);
  --pin:#FFC53D; --pin-dim:rgba(255,197,61,.14); --happy:#B388FF; --happy-dim:rgba(179,136,255,.16);
  --font-title:'Poppins','Inter',Arial,sans-serif; --font-body:'Inter',Arial,sans-serif;
  color-scheme:dark;
  font-size:15px;
}
html.tv{ font-size:clamp(14px,1.05vw,24px); }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(6.5rem + env(safe-area-inset-bottom,0px)); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
html.tv body{ overflow:hidden; padding-bottom:3.6rem; }
*{ box-sizing:border-box; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:2px solid var(--good); outline-offset:2px; }
h1,h2,h3{ font-family:var(--font-title); font-weight:700; letter-spacing:-0.02em; margin:0; text-wrap:balance; }
.eyebrow{ font-size:.72rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--text-2); }
.card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1rem; min-width:0; }
.up{ color:var(--up); } .down{ color:var(--down); } .flat{ color:var(--text-2); }
.mono{ font-variant-numeric:tabular-nums; }
.note{ font-size:.8rem; color:var(--text-3); }

/* Header */
.top{ display:flex; flex-wrap:wrap; align-items:center; gap:.75rem 1.5rem; padding-block:.9rem .6rem; border-bottom:1px solid var(--border); position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
.brand{ display:flex; align-items:baseline; gap:.6rem; min-width:0; }
.brand .hdx{ font-family:var(--font-title); font-weight:700; font-size:1.7rem; letter-spacing:-.03em; }
.brand .name{ font-size:.8rem; color:var(--text-2); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
.status{ display:flex; align-items:center; gap:.5rem; font-size:.85rem; color:var(--text-2); }
.dot{ width:.55rem; height:.55rem; border-radius:50%; background:var(--good); box-shadow:0 0 .6rem var(--good); }
.dot.closed{ background:var(--bad); box-shadow:0 0 .6rem var(--bad); } .dot.pre{ background:var(--pin); box-shadow:0 0 .6rem var(--pin); }
.stat{ display:flex; flex-direction:column; gap:.1rem; min-width:0; }
.stat .lbl{ font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.stat .val{ font-family:var(--font-title); font-weight:600; font-size:1.25rem; line-height:1.1; white-space:nowrap; }
.top .right{ margin-left:auto; display:flex; align-items:center; gap:1rem; }
.copy{ font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--text-3); white-space:nowrap; }
.iconbtn{ border:1px solid var(--border); border-radius:999px; padding:.35rem .7rem; font-size:.78rem; color:var(--text-2); background:var(--card); }
.iconbtn[aria-pressed="true"]{ color:var(--text); border-color:var(--text-3); }

/* Next-move anticipation bar */
.nextbar{ height:3px; background:var(--border); width:100%; position:relative; overflow:hidden; }
.nextbar i{ display:block; height:100%; width:0; background:var(--text-3); transition:width .25s linear; }
html.armed .nextbar i{ background:var(--text); box-shadow:0 0 10px var(--text); }
.stat .val.cd{ transition:color .3s; } html.armed .stat .val.cd{ color:var(--text); animation:breath 1s ease-in-out infinite; }
@keyframes breath{ 0%,100%{ opacity:1 } 50%{ opacity:.45 } }
.pcard,.tbl tr{ transition:border-color .8s ease, box-shadow .8s ease; }
.pcard.next{ border-style:dashed; border-color:var(--text-3); }
html.armed .pcard.next{ border-style:solid; border-color:var(--text); box-shadow:0 0 0 2px rgba(255,255,255,.12), 0 0 28px rgba(255,255,255,.14); animation:breath 1s ease-in-out infinite; }
.tbl tr.next td:first-child{ box-shadow:inset 3px 0 0 var(--text-3); }
html.armed .tbl tr.next td{ background:var(--card-alt); }
.chip.next{ border-color:var(--text-3); }
html.armed .tape{ border-top-color:var(--text-3); }

/* Banners (happy hour / last call) */
.banner{ display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:.6rem; padding:.55rem 1rem; border-radius:12px; font-weight:600; font-family:var(--font-title); letter-spacing:.02em; flex-wrap:wrap; text-align:center; }
.banner.happy{ background:var(--happy-dim); border:1px solid var(--happy); color:var(--happy); }
.banner.last{ background:rgba(255,77,109,.14); border:1px solid var(--bad); color:var(--bad); }
.banner .cd{ font-variant-numeric:tabular-nums; color:var(--text); }

/* News strip */
.news{ overflow:hidden; border-bottom:1px solid var(--border); padding-block:.45rem; margin-top:.4rem; }
.news-track{ display:flex; gap:3rem; width:max-content; animation:tape 90s linear infinite; font-size:.85rem; color:var(--text-2); white-space:nowrap; }
.news-track .tag{ color:var(--pin); font-weight:600; letter-spacing:.1em; font-size:.7rem; margin-right:.6rem; }
@keyframes tape{ from{ transform:translateX(0) } to{ transform:translateX(-50%) } }

/* Main grid */
.main{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:1rem; padding-block:1rem; align-items:start; }
.col{ display:flex; flex-direction:column; gap:1rem; min-width:0; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.6rem; flex-wrap:wrap; }
.sec-head h2{ font-size:1rem; font-weight:600; }
.sec-head .meta{ font-size:.75rem; color:var(--text-3); }

/* Favorites strip */
.favs{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
.chip{ border:1px solid var(--border); background:var(--card); border-radius:999px; padding:.3rem .7rem; font-size:.8rem; display:flex; gap:.5rem; align-items:center; }
.chip .rule{ color:var(--text-3); font-size:.7rem; }

/* Tier 1 cards */
.t1{ display:grid; grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr)); gap:.75rem; }
.pcard{ position:relative; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:.8rem .9rem .7rem; display:flex; flex-direction:column; gap:.3rem; min-width:0; cursor:pointer; }
.pcard.pinned{ border-color:var(--pin); background:linear-gradient(180deg,var(--pin-dim),var(--card) 60%); }
.pcard.suspended{ opacity:.55; }
.tk{ font-family:var(--font-title); font-weight:700; font-size:1.05rem; letter-spacing:-.01em; }
.nm{ font-size:.75rem; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.price{ font-family:var(--font-title); font-weight:600; font-size:1.6rem; line-height:1.05; margin-top:.15rem; }
.chg{ font-size:.85rem; font-weight:500; white-space:nowrap; }
.price-row{ display:flex; align-items:baseline; gap:.4rem; }
.trend{ font-size:.95rem; line-height:1; cursor:help; color:var(--text-3); opacity:.85; align-self:center; }
.detail .trend{ font-size:1.2rem; }
html.tv .trend{ font-size:1.2rem; }
.chg .pct{ margin-left:.3rem; }
.pcard [data-f="spark"] svg{ width:100%; height:2.4rem; display:block; }
.trend svg{ width:.8em; height:.8em; display:inline-block; }
.pinlbl{ display:flex; align-items:center; gap:.35rem; font-size:.7rem; color:var(--pin); font-weight:600; letter-spacing:.04em; }
.pinlbl svg{ width:.8rem; height:.8rem; flex:none; }
.star{ position:absolute; top:.45rem; right:.5rem; font-size:1rem; color:var(--text-3); padding:.25rem .35rem; line-height:1; border-radius:8px; }
.star:hover{ background:var(--card-alt); } .star[aria-pressed="true"]{ color:var(--pin); }
.pcard .hl{ font-size:.68rem; color:var(--text-3); display:flex; justify-content:space-between; gap:.5rem; flex-wrap:wrap; }
.susp{ font-size:.68rem; color:var(--bad); letter-spacing:.1em; text-transform:uppercase; font-weight:600; }

/* Tables */
.tbl{ width:100%; border-collapse:collapse; font-size:.9rem; }
.tbl th{ text-align:left; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); font-weight:500; padding:.35rem .5rem; border-bottom:1px solid var(--border); white-space:nowrap; }
.tbl th[data-sort]{ cursor:pointer; user-select:none; } .tbl th[data-sort]:hover{ color:var(--text); } .tbl th[aria-sort]{ color:var(--text); }
.tbl th[aria-sort="descending"]::after{ content:" \25BE"; } .tbl th[aria-sort="ascending"]::after{ content:" \25B4"; }
.tbl td{ padding:.5rem .5rem; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tbody tr{ cursor:pointer; } .tbl tbody tr:hover td{ background:var(--card-alt); }
.tbl td.num,.tbl th.num{ text-align:right; }
.tbl .tk{ font-size:.95rem; }
.tbl .nm{ display:block; }
.tbl svg{ width:5.5rem; height:1.5rem; display:block; }
.tbl tr.pinned td:first-child{ box-shadow:inset 3px 0 0 var(--pin); }
.tbl tr.suspended{ opacity:.5; }
.tblwrap{ overflow-x:auto; }
.rowstar{ color:var(--text-3); padding:.1rem .3rem; font-size:1rem; }
.rowstar[aria-pressed="true"]{ color:var(--pin); }

/* Ver todo */
.more{ width:100%; border:1px dashed var(--border); border-radius:12px; padding:.7rem; color:var(--text-2); font-size:.9rem; }
.more:hover{ color:var(--text); border-color:var(--text-3); }
.filters{ display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.6rem; }
.filters input{ flex:1 1 10rem; min-width:0; background:var(--bg-alt); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:.5rem .7rem; font:inherit; }
.filters .chip{ cursor:pointer; } .filters .chip[aria-pressed="true"]{ border-color:var(--text); color:var(--text); }

/* Index pane */
.idx-big{ display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
.idx-big .val{ font-family:var(--font-title); font-weight:600; font-size:2.4rem; line-height:1; }
.idx-big .chg{ font-size:1rem; }
.chart{ width:100%; height:9rem; display:block; margin-top:.5rem; }
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:.6rem; margin-top:.8rem; }
.kpi{ background:var(--bg-alt); border:1px solid var(--border); border-radius:10px; padding:.5rem .7rem; min-width:0; }
.kpi .lbl{ font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); }
.kpi .val{ font-family:var(--font-title); font-weight:600; font-size:1.05rem; white-space:nowrap; }

/* Movers */
.movers{ display:grid; grid-template-columns:1fr; gap:.8rem; }
.mv h3{ font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); font-weight:500; margin-bottom:.4rem; }
.mv ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.3rem; }
.mv li{ display:grid; grid-template-columns:auto 1fr auto auto; gap:.6rem; align-items:baseline; font-size:.9rem; cursor:pointer; }
.mv li .n{ color:var(--text-3); font-size:.75rem; width:1rem; }
.mv li .tk{ font-size:.9rem; }
.mv li .nm{ font-size:.72rem; }

/* Sectors heatmap */
.sectors{ display:flex; flex-direction:column; gap:.7rem; }
.sector h3{ font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); font-weight:500; margin-bottom:.35rem; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr)); gap:.35rem; }
.tile{ border-radius:8px; padding:.45rem .5rem; background:var(--card-alt); border:1px solid var(--border); min-width:0; cursor:pointer; }
.tile .tk{ font-size:.85rem; } .tile .v{ font-size:.75rem; display:block; }

/* Ranking */
.tabs{ display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:.6rem; }
.tabs button{ border:1px solid var(--border); border-radius:999px; padding:.25rem .65rem; font-size:.75rem; color:var(--text-2); }
.tabs button[aria-pressed="true"]{ color:var(--text); border-color:var(--text); background:var(--card-alt); }
.rank ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.35rem; }
.rank li{ display:grid; grid-template-columns:1.6rem 1fr auto; gap:.6rem; align-items:center; padding:.45rem .6rem; border-radius:10px; background:var(--bg-alt); border:1px solid var(--border); }
.rank .pos{ font-family:var(--font-title); font-weight:700; color:var(--text-3); }
.rank .who{ font-weight:500; } .rank .how{ font-size:.72rem; color:var(--text-3); display:block; }
.rank .sc{ font-family:var(--font-title); font-weight:600; color:var(--good); white-space:nowrap; }

/* Tape */
.tape{ position:fixed; left:0; right:0; bottom:0; background:var(--bg-alt); border-top:1px solid var(--border); overflow:hidden; z-index:6; padding-bottom:env(safe-area-inset-bottom,0px); transition:border-color .8s; }
.tape-track{ display:flex; width:max-content; animation:tape var(--tape-dur,60s) linear infinite; padding-block:.6rem; }
.tape .it{ display:flex; gap:.5rem; align-items:baseline; padding:0 1.3rem; border-right:1px solid var(--border); font-size:.9rem; white-space:nowrap; }
.tape .it .tk{ font-size:.9rem; } .tape .it .p{ font-weight:600; }
.tape .it.pinned .tk::before{ content:"\25C6"; color:var(--pin); font-size:.6rem; margin-right:.35rem; vertical-align:middle; }

/* Flash animations */
@keyframes flashUp{ 0%{ background:var(--up-dim); box-shadow:inset 0 0 0 1px var(--up);} 100%{ background:transparent; box-shadow:none;} }
@keyframes flashDown{ 0%{ background:var(--down-dim); box-shadow:inset 0 0 0 1px var(--down);} 100%{ background:transparent; box-shadow:none;} }
.flash-up{ animation:flashUp 1.4s ease-out; } .flash-down{ animation:flashDown 1.4s ease-out; }
.pcard.flash-up{ background:var(--card); } .pcard.flash-down{ background:var(--card); }
#pulse{ position:fixed; inset:0; pointer-events:none; z-index:40; opacity:0; }
#pulse.up{ animation:pulseUp 1.6s ease-out; } #pulse.down{ animation:pulseDown 1.6s ease-out; }
@keyframes pulseUp{ 0%{ opacity:1; box-shadow:inset 0 0 0 .4rem var(--up), inset 0 0 8rem rgba(255,77,109,.45);} 100%{ opacity:0; box-shadow:inset 0 0 0 0 var(--up), inset 0 0 0 rgba(46,229,157,0);} }
@keyframes pulseDown{ 0%{ opacity:1; box-shadow:inset 0 0 0 .4rem var(--down), inset 0 0 8rem rgba(46,229,157,.45);} 100%{ opacity:0; box-shadow:inset 0 0 0 0 var(--down), inset 0 0 0 rgba(255,77,109,0);} }

/* Overlay (events, ranking) */
#overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(11,11,13,.92); padding:2rem; }
#overlay .box{ text-align:center; max-width:60rem; width:100%; animation:popIn .5s cubic-bezier(.2,.9,.3,1.2); }
@keyframes popIn{ from{ transform:scale(.85); opacity:0 } to{ transform:scale(1); opacity:1 } }
#overlay .big{ font-family:var(--font-title); font-weight:700; font-size:clamp(2.4rem,8vw,7rem); line-height:1; letter-spacing:-.03em; }
#overlay .sub{ margin-top:1rem; font-size:clamp(1rem,2.5vw,1.8rem); color:var(--text-2); }
#overlay .big.happy{ color:var(--happy); } #overlay .big.refill{ color:var(--good); } #overlay .big.last{ color:var(--bad); } #overlay .big.ipo{ color:var(--pin); }
#overlay .rank{ text-align:left; margin-top:1.5rem; }
#overlay .rank li{ font-size:1.2rem; padding:.7rem 1rem; }
#overlay .bell{ font-size:3rem; }

/* Sheet (detail / follow dialogs) */
#sheet{ position:fixed; inset:0; z-index:55; display:flex; align-items:flex-end; justify-content:center; }
#sheet .bg{ position:absolute; inset:0; background:rgba(11,11,13,.7); }
#sheet .box{ position:relative; background:var(--card); border:1px solid var(--border); border-radius:18px 18px 0 0; width:min(100%,46rem); max-height:88vh; overflow:auto; padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom,0px)); animation:slideUp .3s ease-out; }
@keyframes slideUp{ from{ transform:translateY(30px); opacity:0 } to{ transform:none; opacity:1 } }
@media (min-width:700px){ #sheet{ align-items:center; } #sheet .box{ border-radius:18px; padding-bottom:1.2rem; } }
.sheet-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
.sheet-head .x{ font-size:1.3rem; color:var(--text-3); padding:.2rem .5rem; border-radius:8px; } .sheet-head .x:hover{ background:var(--card-alt); color:var(--text); }
.detail .price{ font-size:2.4rem; }
.detail .chart{ height:11rem; }
.moves{ list-style:none; margin:.6rem 0 0; padding:0; display:flex; flex-direction:column; gap:.25rem; font-size:.85rem; }
.moves li{ display:flex; justify-content:space-between; gap:1rem; padding:.3rem 0; border-bottom:1px solid var(--border); }
.moves li:last-child{ border-bottom:0; }
.opts{ display:flex; flex-direction:column; gap:.5rem; margin:.8rem 0; }
.opt{ display:flex; align-items:center; gap:.6rem; padding:.6rem .7rem; border:1px solid var(--border); border-radius:10px; cursor:pointer; }
.opt input[type="radio"]{ width:auto; margin:0; }
.opt input[type="number"]{ width:6rem; background:var(--bg-alt); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.3rem .5rem; font:inherit; margin-left:auto; }
.btnrow{ display:flex; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; margin-top:.6rem; }

/* Footer brand */
.foot{ display:flex; justify-content:space-between; align-items:center; padding-block:1rem .5rem; color:var(--text-3); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; gap:1rem; flex-wrap:wrap; }
.foot img{ height:24px; width:auto; }

/* TV mode */
html.tv .star,html.tv .rowstar,html.tv .more,html.tv #tier3,html.tv .favs,html.tv .foot,html.tv .tabs{ display:none !important; }
html.tv .main{ display:block; padding-block:1rem; }
html.tv .pane{ display:none; }
html.tv[data-view="board"] .pane-board{ display:block; }
html.tv[data-view="movers"] .pane-movers{ display:block; }
html.tv[data-view="index"] .pane-index{ display:block; }
html.tv[data-view="sectors"] .pane-sectors{ display:block; }
html.tv .pane-board{ display:none; }
html.tv .t1{ grid-template-columns:repeat(4,1fr); gap:1rem; }
html.tv .pcard{ padding:1rem 1.1rem .9rem; cursor:default; } html.tv .price{ font-size:2.2rem; } html.tv .pcard [data-f="spark"] svg{ height:3.2rem; }
html.tv .tbl{ font-size:1.05rem; } html.tv .tbl svg{ width:7rem; height:1.8rem; }
html.tv .movers{ grid-template-columns:repeat(3,1fr); gap:1.5rem; } html.tv .mv li{ font-size:1.4rem; padding:.5rem 0; border-bottom:1px solid var(--border); }
html.tv .chart{ height:38vh; } html.tv .idx-big .val{ font-size:5rem; } html.tv .idx-big .chg{ font-size:1.8rem; }
html.tv .kpis{ grid-template-columns:repeat(5,1fr); } html.tv .kpi .val{ font-size:1.6rem; }
html.tv .tiles{ grid-template-columns:repeat(6,1fr); gap:.6rem; } html.tv .tile{ padding:.9rem 1rem; } html.tv .tile .tk{ font-size:1.3rem; } html.tv .tile .v{ font-size:1rem; }
html.tv .pane-sectors{ display:none; grid-template-columns:3fr 2fr; gap:1.5rem; }
html.tv[data-view="sectors"] .pane-sectors{ display:grid; }
html.tv .newslist{ display:block; }
.newslist{ display:none; list-style:none; margin:0; padding:0; }
html:not(.tv) .newscard{ display:none; }
.newslist li{ padding:.7rem 0; border-bottom:1px solid var(--border); font-size:1.15rem; }
.newslist li .tag{ color:var(--pin); font-size:.7rem; letter-spacing:.12em; margin-right:.6rem; font-weight:600; }
.tvhint{ display:none; }
html.tv .tvhint{ display:flex; gap:.5rem; align-items:center; font-size:.8rem; color:var(--text-3); }
.tvdots{ display:flex; gap:.35rem; } .tvdots i{ width:.45rem; height:.45rem; border-radius:50%; background:var(--border); } .tvdots i.on{ background:var(--text); }

/* Admin */
.admin{ max-width:70rem; margin:0 auto; padding-block:1.5rem 3rem; display:flex; flex-direction:column; gap:1rem; }
.admin h1{ font-size:1.6rem; }
.admin .card h2{ font-size:1rem; font-weight:600; margin-bottom:.8rem; }
.admin label{ display:flex; flex-direction:column; gap:.3rem; font-size:.8rem; color:var(--text-2); min-width:0; }
.admin input,.admin select,.admin textarea{ font:inherit; background:var(--bg-alt); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:.5rem .7rem; min-width:0; width:100%; }
.admin textarea{ min-height:7rem; resize:vertical; }
.admin .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.8rem; align-items:end; }
.btn{ background:var(--navy); border:1px solid var(--navy-2); color:#fff; border-radius:10px; padding:.55rem .9rem; font-weight:500; white-space:nowrap; }
.btn:hover{ background:var(--navy-2); }
.btn.ghost{ background:var(--card); border-color:var(--border); color:var(--text-2); }
.btn.primary{ background:var(--good); color:#0B0B0D; border-color:var(--good); font-weight:600; }
.btn.danger{ background:rgba(255,77,109,.14); border-color:var(--bad); color:var(--bad); }
.btn:disabled{ opacity:.45; cursor:default; }
.statusbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:.8rem; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; }
.statusbar .msg{ font-size:.85rem; color:var(--text-2); flex:1 1 14rem; }
.statusbar .msg b{ color:var(--text); font-weight:500; }
.pill{ display:inline-flex; align-items:center; gap:.4rem; border-radius:999px; padding:.2rem .6rem; font-size:.72rem; border:1px solid var(--border); color:var(--text-2); }
.pill.ok{ border-color:var(--good); color:var(--good); } .pill.warn{ border-color:var(--pin); color:var(--pin); }
.admin .tbl input{ padding:.3rem .45rem; border-radius:7px; font-size:.85rem; }
.admin .tbl td{ white-space:normal; } .admin .tbl tbody tr{ cursor:default; } .admin .tbl tbody tr:hover td{ background:transparent; }
.admin .tbl input[type="number"]{ width:5rem; }
.admin .tbl input.pin{ width:11rem; }
.admin .tbl input.name{ width:9rem; }
.gate{ max-width:26rem; margin:4rem auto; display:flex; flex-direction:column; gap:.8rem; }
.gate .err{ color:var(--bad); font-size:.85rem; min-height:1.2em; }
.toast{ position:fixed; left:50%; bottom:5rem; transform:translateX(-50%); background:var(--card-alt); border:1px solid var(--border); border-radius:12px; padding:.6rem 1rem; font-size:.9rem; z-index:60; max-width:90vw; }
.toast.alert{ border-color:var(--pin); font-weight:500; }
.evbtns{ display:flex; gap:.5rem; flex-wrap:wrap; }
.admin .section-links code{ background:var(--bg-alt); border:1px solid var(--border); border-radius:6px; padding:.15rem .4rem; font-size:.85rem; }

/* Pre-open */
.preopen{ padding:2rem 0; text-align:center; color:var(--text-2); }

@media (max-width:900px){
  .main{ grid-template-columns:1fr; }
  .top .name{ display:none; }
  .top{ gap:.5rem 1rem; }
  .copy{ display:none; }
}
@media (max-width:520px){
  :root{ font-size:14px; }
  .t1{ grid-template-columns:repeat(2,1fr); gap:.5rem; }
  .price{ font-size:1.35rem; }
  .tbl .hide-sm{ display:none; }
  .stat .val{ font-size:1.05rem; }
}
@media (prefers-reduced-motion:reduce){
  .news-track,.tape-track{ animation:none; }
  .flash-up,.flash-down,#pulse.up,#pulse.down,#overlay .box,#sheet .box,html.armed .stat .val.cd{ animation:none; }
}

/* ---------- helpers ---------- */
const $=(s,r)=> (r||document).querySelector(s);
const clamp=(v,a,b)=> v<a?a:v>b?b:v;
const snap=v=> Math.round(v/STEP)*STEP;
function money(n){ n=Math.round(n); const s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return (n<0?'-$':'$')+s; }
function pct(v){ const s=(v*100).toFixed(1).replace('.',','); return (v>0?'+':'')+s+'%'; }
function signed(n){ return (n>0?'+':'')+money(n); }
function hhmm(t){ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function hhmmss(t){ const d=new Date(t); return hhmm(t)+':'+String(d.getSeconds()).padStart(2,'0'); }
function mmss(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hash32(a,b,c){ let h=(a^0x9E3779B9)>>>0; h=Math.imul(h^(b>>>0),0x85EBCA6B)>>>0; h=Math.imul(h^(c>>>0),0xC2B2AE35)>>>0; h^=h>>>16; h=Math.imul(h,0x27D4EB2F)>>>0; h^=h>>>15; return h>>>0; }
function rng(seed){ return function(){ seed=(seed+0x6D2B79F5)>>>0; let t=seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function cls(v){ return v>0?'up':v<0?'down':'flat'; }
function arrow(v){ return v>0?'▲':v<0?'▼':'▬'; }
function fmtIdx(v){ return v.toFixed(1).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }

/* sound */
let soundOn=false; try{ const s=localStorage.getItem('hdx-sound'); soundOn= s==='1'; }catch(e){}
let audio=null;
function tone(f,t0,dur,vol,type){ const o=audio.createOscillator(), g=audio.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0+dur+.05); }
function sfx(kind){ if(!soundOn) return; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audio=audio||new AC(); if(audio.state==='suspended') audio.resume(); const n=audio.currentTime;
  switch(kind){
    case 'up': tone(880,n,.14,.10,'triangle'); tone(1320,n+.09,.22,.10,'triangle'); break;
    case 'down': tone(660,n,.14,.10,'triangle'); tone(440,n+.09,.25,.10,'triangle'); break;
    case 'big': [1320,1760].forEach((f,i)=>tone(f,n+i*.15,1.1,.2,'sine')); break;
    case 'event': [660,880,1100,1320].forEach((f,i)=>tone(f,n+i*.12,.6,.18,'sine')); break;
    case 'alert': [1500,1500,1500].forEach((f,i)=>tone(f,n+i*.18,.12,.2,'square')); break;
    case 'chime': [1047,1319,1568].forEach((f,i)=>tone(f,n+i*.1,.9,.12,'sine')); break;
    case 'tick': tone(1400,n,.04,.05,'square'); break;
    case 'open': [523,659,784,1047].forEach((f,i)=>tone(f,n+i*.15,1.2,.18,'sine')); break;
  } }catch(e){} }

/* ---------- market simulation (deterministic from seed + wall clock) ---------- */
function newSim(cfg){
  const prods=cfg.products.filter(p=>!p.hidden).map((p,i)=>({ t:p.t, name:p.name, sector:p.sector, base:p.base, stock0:p.stock, stock:p.stock, pop:p.pop||1, pin:p.pin||'', pinned:!!(p.pinned||p.pin), ipoAt:p.ipoAt||null, i,
    price:p.base, eff:p.base, mood:1, W:0, ring:new Array(WIN).fill(0), vol:0, hist:[], full:[], moves:[], suspended:false, active:!p.ipoAt, hi:p.base, lo:p.base, changedAt:-1, dir:0, bigAt:-999, bigDir:0, pct10:0 }));
  const closeTick=Math.floor((cfg.sessionHours||8)*3600000/TICK);
  const avgBase= prods.length? prods.reduce((a,p)=>a+p.base,0)/prods.length : 300;
  return { cfg, open:cfg.openAt, closeTick, prods, k:-1, idx:[], idxHi:1000, idxLo:1000, tiers:{t1:[],t2:[],t3:[]}, news:[], traders:[], totalVol:0, avgBase };
}
function happyAt(cfg,t){ return (cfg.events||[]).find(e=>e.type==='happy' && t>=e.at && t<e.at+e.dur*60000)||null; }
function lastCallAt(cfg,t){ return (cfg.events||[]).find(e=>e.type==='last' && t>=e.at && t<e.at+(e.dur||10)*60000)||null; }
function step(sim,k){
  const cfg=sim.cfg, t=sim.open+k*TICK;
  const happy=happyAt(cfg,t); const hp=(cfg.settings.happyPct||30)/100;
  const imps=cfg.impulses||[];
  for(const p of sim.prods){
    if(p.ipoAt && t<p.ipoAt){ p.hist.push(null); p.full.push(null); if(p.hist.length>MAXH) p.hist.shift(); continue; }
    p.active=true;
    const r=rng(hash32(cfg.seed, p.i+1, k+1));
    if(k%TRADER_EVAL===0){ p.mood=clamp(p.mood+(r()-0.5)*0.55, 0.45, 1.85); }
    const rel=p.eff/p.base; const elas=clamp(1+(1-rel)*0.9, 0.3, 1.9);
    const lam=0.03*(TICK/5000)*p.pop*p.mood*elas*(happy?1.7:1);
    let sales=Math.floor(lam)+(r()<lam-Math.floor(lam)?1:0);
    for(const im of imps){ if(im.t===p.t && Math.floor((im.at-sim.open)/TICK)===k) sales+=im.qty; }
    if(p.stock<=0){ sales=0; p.suspended=true; } else { sales=Math.min(sales,p.stock); p.stock-=sales; if(p.stock<=0) p.suspended=true; }
    const old=p.ring[k%WIN]; p.ring[k%WIN]=sales; p.W+=sales-old; p.vol+=sales; sim.totalVol+=sales;
    if(k%sim.prods.length===p.i && !p.suspended){ // each tick evaluates one product, in turn
      const wref=3.6*p.pop; let steps=Math.round((p.W-wref)/2.5);
      if(p.stock>0 && p.stock<=p.stock0*0.15) steps+=1;
      const target=clamp(p.base+steps*STEP, PMIN, PMAX);
      const jump= Math.abs(target-p.price)>=2*STEP ? 2*STEP : STEP;
      if(target>p.price) p.price=Math.min(target,p.price+jump); else if(target<p.price) p.price=Math.max(target,p.price-jump);
    }
    const prevEff=p.eff;
    if(!p.suspended) p.eff = happy ? Math.max(PMIN, snap(p.price*(1-hp))) : p.price;
    if(p.eff!==prevEff){ p.changedAt=k; p.dir=p.eff>prevEff?1:-1; p.moves.push({k, price:p.eff, d:p.eff-prevEff}); if(p.moves.length>200) p.moves.shift(); }
    p.hi=Math.max(p.hi,p.eff); p.lo=Math.min(p.lo,p.eff);
    p.hist.push(p.eff); if(p.hist.length>MAXH) p.hist.shift(); p.full.push(p.eff);
    const h=p.hist, ref=h.length>WIN? h[h.length-1-WIN] : h[0];
    p.pct10= ref? (p.eff-ref)/ref : 0;
    const ref6=h.length>BIG_N? h[h.length-1-BIG_N] : null;
    if(ref6!=null && Math.abs(p.eff-ref6)>=2*STEP && k-p.bigAt>BIG_COOL){ p.bigAt=k; p.bigDir=p.eff>ref6?1:-1; }
  }
  let num=0, den=0; for(const p of sim.prods){ if(!p.active) continue; const w=p.vol+5; num+=p.eff*w; den+=p.base*w; }
  const idx= den? Math.round(1000*num/den*10)/10 : 1000; sim.idx.push(idx); sim.idxHi=Math.max(sim.idxHi,idx); sim.idxLo=Math.min(sim.idxLo,idx);
  if(k%TIER_EVAL===0) computeTiers(sim);
  if(k%TIER_EVAL===0) makeNews(sim,k,t);
  if(k%TRADER_EVAL===0) makeTraders(sim,k);
  sim.k=k;
}
function score(p){ return Math.abs(p.pct10)*100 + p.W*4 + (p.suspended?-30:0) + (p.bigAt>=0 && p.changedAt-p.bigAt<TRADER_EVAL? 10:0); }
function computeTiers(sim){
  const s=sim.cfg.settings; const act=sim.prods.filter(p=>p.active);
  const pinned=act.filter(p=>p.pinned), rest=act.filter(p=>!p.pinned).sort((a,b)=>score(b)-score(a));
  const all=pinned.concat(rest); const n1=Math.max(pinned.length, s.tier1||8), n2=s.tier2||8;
  sim.tiers={ t1:all.slice(0,n1), t2:all.slice(n1,n1+n2), t3:all.slice(n1+n2) };
}
function makeNews(sim,k,t){
  const r=rng(hash32(sim.cfg.seed, 7777, k)); const act=sim.prods.filter(p=>p.active&&!p.suspended);
  if(!act.length) return;
  const byChg=act.slice().sort((a,b)=>(b.eff/b.base)-(a.eff/a.base)); const top=byChg[0], bot=byChg[byChg.length-1];
  const byW=act.slice().sort((a,b)=>b.W-a.W); const hot=byW[0];
  const pc=p=>Math.abs(Math.round((p.eff-p.base)/p.base*100));
  const last=sim.idx[sim.idx.length-1];
  const bank=[
    ()=> top.eff>top.base ? `${top.name} sube ${pc(top)}% tras fuerte demanda en la pista` : null,
    ()=> bot.eff<bot.base ? `${bot.name} toca mínimo de la noche: "oportunidad de compra", dicen en la barra` : null,
    ()=> `Analistas recomiendan comprar ${bot.name} antes del próximo refill`,
    ()=> bot.eff<bot.base ? `Pánico en el sector ${bot.sector}: ${bot.name} cae ${pc(bot)}%` : null,
    ()=> hot.W>0 ? `${hot.name} lidera el volumen con ${hot.W} unidades en 10 minutos` : null,
    ()=> `Banco Central de Haulmerland evalúa nueva inyección de liquidez`,
    ()=> `Índice HDX en ${fmtIdx(last)} puntos: ${last>=1000?'optimismo':'cautela'} en la barra`,
    ()=> `Rumores de Happy Hour mueven el mercado`,
    ()=> sim.totalVol>0 ? `Se transaron ${sim.totalVol} tragos desde la apertura` : null,
    ()=> top.pinned ? `${top.name} se mantiene fijado por la organización${top.pin?': "'+top.pin+'"':''}` : `${top.name} es el activo más rentable de la noche`,
  ];
  const susp=sim.prods.find(p=>p.suspended && p.changedAt>=k-TIER_EVAL); if(susp) sim.news.unshift({k,text:`${susp.name} agotado: el mercado suspende su cotización`});
  for(let i=0;i<2;i++){ const f=bank[Math.floor(r()*bank.length)]; const txt=f(); if(txt && !sim.news.some(n=>n.text===txt)) sim.news.unshift({k,text:txt}); }
  sim.news=sim.news.slice(0,8);
}
function makeTraders(sim,k){
  const r=rng(hash32(sim.cfg.seed, 4242, Math.floor(k/TRADER_EVAL)));
  const names=TRADER_NAMES.slice().sort(()=>r()-0.5).slice(0,8);
  sim.traders=names.map((n,i)=>{ const drinks=2+Math.floor(r()*11); const avgPaid= i<3 ? Math.round((100+r()*120)/10)*10 : Math.round((120+r()*330)/10)*10; return {name:n, drinks, avgPaid, spent:drinks*avgPaid, tx:Math.floor(r()*7), save:Math.round((sim.avgBase-avgPaid)/sim.avgBase*100)}; });
}

/* ---------- sparkline / chart ---------- */
function sparkPath(vals,w,h){ const v=vals.filter(x=>x!=null); if(v.length<2) return ''; let mn=Math.min(...v), mx=Math.max(...v); if(mx===mn){ mx+=1; mn-=1; } const n=v.length; return v.map((y,i)=>(i?'L':'M')+(i/(n-1)*w).toFixed(1)+' '+(h-((y-mn)/(mx-mn))*(h-2)-1).toFixed(1)).join(' '); }
function sparkSvg(p){ const d=sparkPath(p.hist.slice(-SPARK_N),100,30); const c=p.eff>=p.base?'var(--up)':'var(--down)'; return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`; }
function lineChart(raw, baseline, id, label){
  const vals=raw.filter(x=>x!=null);
  if(vals.length<2) return `<svg class="chart" viewBox="0 0 600 160" preserveAspectRatio="none" aria-label="${esc(label)}"><line x1="0" y1="80" x2="600" y2="80" stroke="var(--border)"/></svg>`;
  const N=240; const stepN=Math.max(1,Math.ceil(vals.length/N)); const v=[]; for(let i=0;i<vals.length;i+=stepN) v.push(vals[i]); if(v[v.length-1]!==vals[vals.length-1]) v.push(vals[vals.length-1]);
  let mn=Math.min(...v,baseline), mx=Math.max(...v,baseline); const pad=(mx-mn)*0.15||5; mn-=pad; mx+=pad;
  const W=600,H=160; const X=i=>i/(v.length-1)*W, Y=y=>H-(y-mn)/(mx-mn)*H;
  const line=v.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)).join(' ');
  const area=line+` L${W} ${H} L0 ${H} Z`; const yb=Y(baseline).toFixed(1);
  const last=v[v.length-1]; const c= last>=baseline?'var(--up)':'var(--down)';
  const grid=[0.25,0.5,0.75].map(f=>`<line x1="0" x2="${W}" y1="${(H*f).toFixed(0)}" y2="${(H*f).toFixed(0)}" stroke="var(--border)" stroke-dasharray="3 5"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(label)}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="0" x2="${W}" y1="${yb}" y2="${yb}" stroke="var(--text-3)" stroke-dasharray="4 4"/><path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4" fill="${c}"/></svg>`;
}

/* ---------- follows: alerts while the page is open ---------- */
function checkFollows(){
  let changed=false;
  for(const t of Object.keys(follows)){ const r=follows[t]; const p=sim.prods.find(x=>x.t===t); if(!p) continue; const prev= r.last==null? p.eff : r.last; if(p.eff!==prev){
    let msg='';
    if(r.mode==='any') msg=`${p.name} ${p.eff>prev?'subió':'bajó'} a ${money(p.eff)} (${signed(p.eff-prev)})`;
    else if(r.mode==='below' && p.eff<=r.value && prev>r.value) msg=`${p.name} bajó a ${money(p.eff)}: tu precio objetivo`;
    else if(r.mode==='above' && p.eff>=r.value && prev<r.value) msg=`${p.name} subió a ${money(p.eff)}: alcanzó tu alerta`;
    if(msg) notify(msg);
  } if(r.last!==p.eff){ r.last=p.eff; changed=true; } }
  if(changed) saveFollows();
}
function notify(msg){ toast('🔔 '+msg,'alert',6000); sfx('alert'); try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){} try{ if('Notification' in window && Notification.permission==='granted' && document.hidden) new Notification('HDX',{body:msg}); }catch(e){} }

/* ---------- main loop ---------- */
let shellBuilt=false;
function tick(){
  const now=Date.now(); const info=marketInfo(now);
  if(!shellBuilt){ renderShell(); shellBuilt=true; }
  if(info.k>sim.k) advance(sim,info.k);
  if(info.status==='pre' && sim.k<0 && !sim.tiers.t1.length){ computeTiers(sim); sim.idx=[1000]; }

  renderBoard(false);
  if(info.k!==lastRenderedK || info.status==='pre') updateBoard();
  updateOverlay(now);
}

  app.innerHTML=`<div class="admin">
    <div class="statusbar"><div class="msg"><b>Mesa de control HDX</b> · Mercado ${openTxt} · Publicación: <span class="pill ${LOCAL_ONLY?'warn':'ok'}" id="pubstate">${LOCAL_ONLY?'solo este navegador':'compartida'}</span></div>
      <button class="btn ghost" id="discard">Descartar cambios</button><button class="btn primary" id="publish">Publicar cambios</button><a class="btn ghost" href="#" id="toboard">Ver tablero</a></div>
    <p class="note">Los cambios se aplican a todas las pantallas al publicar. Si la publicación no está disponible, se guardan solo en este navegador y así lo indica el estado.</p>

    <div class="card"><h2>Mercado</h2><div class="grid">
      <label>Duración de la sesión (horas)<input type="number" id="hours" value="${draft.sessionHours}" min="1" max="24" step="0.5"></label>
      <label>Semilla de la simulación<input type="number" id="seed" value="${draft.seed}"></label>
      <button class="btn" id="openNow">🔔 Abrir el mercado ahora</button>
      <button class="btn danger" id="closeNow">Cerrar el mercado ahora</button>
    </div><p class="note">Abrir el mercado reinicia precios, historial, eventos y stock. Cambiar la semilla cambia la "suerte" de la simulación sin reiniciar la hora.</p></div>

    <div class="card"><h2>Eventos</h2><div class="grid">
      <label>Happy Hour: descuento %<input type="number" id="hpct" value="${s.happyPct}" min="5" max="80"></label>
      <label>Happy Hour: minutos<input type="number" id="hmin" value="10" min="1" max="120"></label>
      <button class="btn" id="happy">✨ Iniciar Happy Hour</button>
      <label>Refill: monto<input type="number" id="ramt" value="${s.refillAmount}" step="500"></label>
      <button class="btn" id="refillNow">🏦 Dar refill ahora</button>
      <label>Anunciar próximo refill en (min)<input type="number" id="rmin" value="30" min="1"></label>
      <button class="btn ghost" id="refillSched">Mostrar cuenta regresiva</button>
      <button class="btn ghost" id="refillClear" ${draft.nextRefillAt?'':'disabled'}>Quitar cuenta regresiva</button>
      <label>Último llamado: minutos<input type="number" id="lmin" value="10" min="1" max="60"></label>
      <button class="btn danger" id="lastcall">🔔 Activar último llamado</button>
      ${happyAt(draft,now)?`<button class="btn danger" id="endHappy">Terminar Happy Hour ahora (termina ${hhmm(happyAt(draft,now).at+happyAt(draft,now).dur*60000)})</button>`:''}
      ${lastCallAt(draft,now)?`<button class="btn danger" id="endLast">Terminar último llamado ahora</button>`:''}
    </div><p class="note">La cuenta regresiva del refill solo aparece en el tablero cuando la anuncias aquí${draft.nextRefillAt?` (anunciada para las ${hhmm(draft.nextRefillAt)})`:''}.</p>
    <h2 style="margin-top:1rem">IPO: lanzar un activo nuevo ahora</h2><div class="grid">
      <label>Ticker<input id="ipoT" maxlength="4" placeholder="SHOT" style="text-transform:uppercase"></label>
      <label>Nombre<input id="ipoN" placeholder="Shot sorpresa"></label>
      <label>Sector<input id="ipoS" placeholder="Cócteles"></label>
      <label>Precio base<input id="ipoB" type="number" value="300" step="50" min="100" max="500"></label>
      <label>Stock<input id="ipoK" type="number" value="60" min="1"></label>
      <button class="btn" id="ipo">🚀 Lanzar IPO</button>
    </div>
    <div style="margin-top:.8rem"><span class="eyebrow">Eventos programados</span><ul id="evlist" class="note" style="margin:.4rem 0 0;padding-left:1.1rem">${(draft.events||[]).slice().reverse().slice(0,8).map(e=>`<li>${hhmm(e.at)} · ${e.type==='happy'?`Happy Hour ${e.dur} min`:e.type==='refill'?`Refill ${money(e.amount)}`:e.type==='last'?`Último llamado ${e.dur} min`:e.type==='ipo'?`IPO ${e.t}`:'Apertura'}</li>`).join('')||'<li>Sin eventos</li>'}</ul></div></div>

    <div class="card"><h2>Productos</h2><div class="tblwrap"><table class="tbl" id="ptable"><thead><tr><th>Ticker</th><th>Nombre</th><th>Sector</th><th>Base $</th><th>Stock</th><th>Demanda</th><th>Pin</th><th>Motivo del pin (opcional)</th><th>Oculto</th><th></th></tr></thead><tbody>${prodRows}</tbody></table></div>
      <div class="evbtns" style="margin-top:.8rem"><button class="btn ghost" id="addProd">+ Agregar producto</button></div>
      <p class="note">Demanda es el multiplicador base de ventas (1 = normal). Un producto con pin aparece siempre primero; el motivo es opcional y se muestra junto al pin. "+8 ventas" inyecta demanda para probar cómo reacciona el precio.</p></div>

    <div class="card"><h2>Noticias</h2><label>Titulares propios (uno por línea; se mezclan con los generados por el mercado)<textarea id="heads">${esc((draft.headlines||[]).join('\n'))}</textarea></label></div>

    <div class="card"><h2>Pantalla</h2><div class="grid">
      <label>Modo TV: rotación de vistas (seg)<input type="number" id="rot" value="${s.tvRotateSec}" min="5" max="300"></label>
      <label>Ranking de traders: cada (min)<input type="number" id="rkEvery" value="${s.rankingEveryMin}" min="1" max="120"></label>
      <label>Ranking: mostrar (seg)<input type="number" id="rkShow" value="${s.rankingShowSec}" min="5" max="120"></label>
      <label>Activos en primera rueda<input type="number" id="t1n" value="${s.tier1}" min="2" max="12"></label>
      <label>Activos en segunda rueda<input type="number" id="t2n" value="${s.tier2}" min="0" max="20"></label>
      <label>Cada producto cambia como máximo cada (min)<input type="number" id="productMin" value="${s.productMin||4}" min="0.5" max="30" step="0.5"></label>
      <label>Saldo inicial por persona (solo campana de apertura)<input type="number" id="bal" value="${s.balance}" step="500"></label>
    </div><p class="note">Los productos se evalúan por turnos: con ${draft.products.filter(p=>!p.hidden).length} activos y ${s.productMin||4} min por producto, la pantalla muestra una evaluación cada ${deriveMoveSec(draft)} segundos. Cambiar este ritmo recalcula toda la noche (la historia cambia). Cada evaluación mueve el precio hasta $100. En TV el ranking rota de criterio en cada aparición: más barato, más tragos, más gastado, más caro, más transferencias.</p></div>

    <div class="card"><h2>Seguridad</h2><div class="grid">
      <label>Nueva contraseña (frase larga)<input type="password" id="np1" autocomplete="new-password"></label>
      <label>Repetir<input type="password" id="np2" autocomplete="new-password"></label>
      <button class="btn ghost" id="setpw">Cambiar contraseña</button>
    </div><p class="note">Se guarda solo el hash SHA-256. Usa una frase de varias palabras: una contraseña corta se puede adivinar probando contra el hash.</p></div>

    <div class="card section-links"><h2>Enlaces</h2><p class="note">Tablero: el enlace del artefacto tal cual. Modo TV: agrega <code>#tv</code> al final. Mesa de control: agrega <code>#admin</code>.</p></div>
    <div class="foot"><span>HDX · Mesa de control</span><img src="${WORDMARK}" alt="Haulmer"></div>
  </div>`;
  const upd=()=>{ $('#publish').disabled=!dirty(); $('#publish').textContent= dirty()?'Publicar cambios':'Sin cambios'; };
  const bind=(id,fn)=>{ const el=$('#'+id); if(el) el.addEventListener('click',e=>{ e.preventDefault(); fn(); }); };
  const onInput=(id,fn)=>{ const el=$('#'+id); if(el) el.addEventListener('input',()=>{ fn(el); upd(); }); };
  onInput('hours',el=>draft.sessionHours=+el.value||8); onInput('seed',el=>draft.seed=+el.value||1);
  onInput('hpct',el=>draft.settings.happyPct=+el.value||30); onInput('ramt',el=>draft.settings.refillAmount=+el.value||2000);
  onInput('rot',el=>draft.settings.tvRotateSec=+el.value||20); onInput('rkEvery',el=>draft.settings.rankingEveryMin=+el.value||10); onInput('rkShow',el=>draft.settings.rankingShowSec=+el.value||15);
  onInput('t1n',el=>draft.settings.tier1=+el.value||8); onInput('t2n',el=>draft.settings.tier2=+el.value||8); onInput('bal',el=>draft.settings.balance=+el.value||5000); onInput('productMin',el=>{ draft.settings.productMin=Math.max(0.5,Math.min(30,+el.value||4)); draft.settings.moveSec=deriveMoveSec(draft); });
  onInput('heads',el=>draft.headlines=el.value.split('\n').map(x=>x.trim()).filter(Boolean));
  $('#ptable').addEventListener('input',e=>{ const el=e.target; if(el.dataset.i==null) return; const p=draft.products[+el.dataset.i]; const k=el.dataset.k; if(k==='hidden') p.hidden=el.checked; else if(k==='pinned'){ p.pinned=el.checked; } else if(['base','stock','pop'].includes(k)) p[k]=+el.value||0; else p[k]= k==='t'? el.value.toUpperCase().trim() : el.value; upd(); });
  $('#ptable').addEventListener('click',e=>{ const d=e.target.closest('[data-del]'); const im=e.target.closest('[data-imp]'); if(d){ draft.products.splice(+d.dataset.del,1); renderAdmin(); } if(im){ const p=draft.products[+im.dataset.imp]; draft.impulses=(draft.impulses||[]).concat([{t:p.t,at:Date.now()+TICK,qty:8}]); toast(`+8 ventas de ${p.name} al publicar`); upd(); } });
  bind('addProd',()=>{ draft.products.push({t:'NUEV',name:'Nuevo trago',sector:'Cócteles',base:300,stock:50,pop:1,pin:'',hidden:false}); renderAdmin(); });
  bind('openNow',()=>{ const t=Date.now()-2000; draft.openAt=t; draft.events=[{type:'open',at:t}]; draft.impulses=[]; draft.nextRefillAt=null; draft.products.forEach(p=>{ delete p.ipoAt; }); toast('Mercado listo para abrir al publicar'); renderAdmin(); });
  bind('closeNow',()=>{ draft.sessionHours=Math.max(0.01,(Date.now()-draft.openAt)/3600000); toast('El mercado cerrará al publicar'); upd(); });
  bind('happy',()=>{ draft.events=(draft.events||[]).concat([{type:'happy',at:Date.now()+1500,dur:+$('#hmin').value||10}]); toast('Happy Hour programada al publicar'); renderAdmin(); });
  bind('refillNow',()=>{ draft.events=(draft.events||[]).concat([{type:'refill',at:Date.now()+1500,amount:+$('#ramt').value||2000}]); draft.nextRefillAt=null; toast('Refill al publicar'); renderAdmin(); });
  bind('refillSched',()=>{ draft.nextRefillAt=Date.now()+(+$('#rmin').value||30)*60000; toast('Cuenta regresiva lista al publicar'); renderAdmin(); });
  bind('refillClear',()=>{ draft.nextRefillAt=null; toast('Cuenta regresiva quitada al publicar'); renderAdmin(); });
  bind('endHappy',()=>{ const e=happyAt(draft,Date.now()); if(e){ e.dur=Math.max(0.01,(Date.now()-e.at)/60000); toast('Happy Hour termina al publicar'); renderAdmin(); } });
  bind('endLast',()=>{ const e=lastCallAt(draft,Date.now()); if(e){ e.dur=Math.max(0.01,(Date.now()-e.at)/60000); toast('Último llamado termina al publicar'); renderAdmin(); } });
  bind('lastcall',()=>{ draft.events=(draft.events||[]).concat([{type:'last',at:Date.now()+1500,dur:+$('#lmin').value||10}]); toast('Último llamado al publicar'); renderAdmin(); });
  bind('ipo',()=>{ const t=($('#ipoT').value||'').toUpperCase().trim(), n=$('#ipoN').value.trim(); if(!t||!n){ toast('Falta ticker o nombre'); return; } const at=Date.now()+1500; draft.products.push({t,name:n,sector:$('#ipoS').value.trim()||'Cócteles',base:+$('#ipoB').value||300,stock:+$('#ipoK').value||60,pop:1.2,pin:'',hidden:false,ipoAt:at}); draft.events=(draft.events||[]).concat([{type:'ipo',at,t,name:n,base:+$('#ipoB').value||300}]); toast('IPO lista al publicar'); renderAdmin(); });
  bind('setpw',async()=>{ const a=$('#np1').value, b=$('#np2').value; if(a.length<12){ toast('Usa al menos 12 caracteres'); return; } if(a!==b){ toast('Las contraseñas no coinciden'); return; } draft.adminHash=await sha256(a); toast('Contraseña lista al publicar'); upd(); });
  bind('discard',()=>{ draft=null; renderAdmin(); });
  bind('toboard',()=>{ view=''; try{ sessionStorage.setItem('hdx-view',''); }catch(e){} shellBuilt=false; boardSig=''; lastRenderedK=-2; start(); });
  bind('publish',publishDraft);
  upd();
}
async function publishDraft(){
  if(!dirty()) return; const btn=$('#publish'); btn.disabled=true; btn.textContent='Publicando…';
  const newCfg=JSON.parse(JSON.stringify(draft)); newCfg.rev=(CFG.rev||0)+1; newCfg.updatedAt=Date.now(); newCfg.settings.moveSec=deriveMoveSec(newCfg);
  const json=JSON.stringify(newCfg).replace(/<\//g,'<\\/');
  let mode='local', err='';
  try{
    const art= window.claude && window.claude.use ? await window.claude.use('artifact') : null;
    if(art){
      const re=/(<script type="application\/json" id="hdx-config">)[\s\S]*?(<\/script>)/; let html='';
      for(const u of ['index.html','./',location.pathname]){ try{ const res=await fetch(u,{cache:'no-store'}); if(!res.ok) continue; const t=await res.text(); if(re.test(t) && /^\s*<!doctype html>/i.test(t)){ html=t; break; } }catch(e){} }
      if(!html) throw Object.assign(new Error('marker'),{code:'marker'});
      html=html.replace(re,(m,a,b)=>a+json+b);
      try{ sessionStorage.setItem('hdx-admin','1'); sessionStorage.setItem('hdx-view','admin'); localStorage.removeItem('hdx-local-cfg'); }catch(e){}
      await art.publish(html); mode='shared';
    }
  }catch(e){ err=(e&&e.code)||'error'; if(err==='conflict'){ toast('Alguien publicó antes. La página se recargará con la versión nueva.'); return; } }
  if(mode!=='shared'){
    try{ localStorage.setItem('hdx-local-cfg',JSON.stringify(newCfg)); }catch(e){}
    CFG=newCfg; LOCAL_ONLY=true; sim=newSim(CFG); draft=null; try{ sessionStorage.setItem('hdx-admin','1'); sessionStorage.setItem('hdx-view','admin'); }catch(e){} renderAdmin(); setTimeout(()=>{ try{ location.reload(); }catch(e){} },1800);
    toast(err==='not_writer'||err==='not_granted'? 'No tienes permiso de edición: cambios guardados solo en este navegador.' : 'Publicación compartida no disponible aquí: cambios guardados solo en este navegador.');
  } else { toast('Publicado. Todas las pantallas se actualizan.'); }
}

/* ---------- boot ---------- */
let loop=null;
function start(){
  clearInterval(loop); closeSheet();
  if(view==='admin'){ if(unlocked) renderAdmin(); else renderGate(); return; }
  tick(); loop=setInterval(tick,250);
}
window.addEventListener('hashchange',()=>{ const v=(location.hash||'').replace('#',''); view=(v==='tv'||v==='admin')?v:''; try{ sessionStorage.setItem('hdx-view',view); }catch(e){} shellBuilt=false; boardSig=''; lastRenderedK=-2; start(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && view!=='admin') tick(); });
start();
})();
</script>
